[project]
name = "ai-video-generation"
version = "0.1.0"
description = "An AI short-video production platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29,<1.0",
    "edge-tts>=7.0,<8.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "redis>=5.0,<7.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: tests that require an explicitly configured external service",
  "external_integration: tests that call a paid or remote provider only when explicitly enabled",
]

[tool.ruff]
line-length = 100
target-version = "py311"
