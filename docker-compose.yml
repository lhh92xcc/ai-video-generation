x-app-environment: &app-environment
  AI_VIDEO_PERSISTENCE_BACKEND: postgres
  AI_VIDEO_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_video
  AI_VIDEO_QUEUE_BACKEND: redis
  AI_VIDEO_REDIS_URL: redis://redis:6379/0
  AI_VIDEO_QUEUE_NAME: ai-video-generation
  AI_VIDEO_AUTH_MODE: "${AI_VIDEO_AUTH_MODE:-local}"
  AI_VIDEO_AUTH_SHARED_SECRET: "${AI_VIDEO_AUTH_SHARED_SECRET:-}"
  AI_VIDEO_AUTH_IDENTITY_TTL_SECONDS: "${AI_VIDEO_AUTH_IDENTITY_TTL_SECONDS:-60}"
  AI_VIDEO_AUTH_LOCAL_ACTOR_ID: "${AI_VIDEO_AUTH_LOCAL_ACTOR_ID:-local-operator}"
  AI_VIDEO_AUTH_LOCAL_ACTOR_NAME: "${AI_VIDEO_AUTH_LOCAL_ACTOR_NAME:-本地操作员}"
  AI_VIDEO_STORAGE_PROVIDER: minio
  AI_VIDEO_STORAGE_ENDPOINT: http://minio:9000
  AI_VIDEO_STORAGE_PUBLIC_ENDPOINT: "${AI_VIDEO_STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}"
  AI_VIDEO_STORAGE_BUCKET: ai-video-artifacts
  AI_VIDEO_STORAGE_REGION: us-east-1
  AI_VIDEO_STORAGE_ACCESS_KEY: "${AI_VIDEO_STORAGE_ACCESS_KEY:-ai-video-dev}"
  AI_VIDEO_STORAGE_SECRET_KEY: "${AI_VIDEO_STORAGE_SECRET_KEY:-ai-video-dev-password}"
  AI_VIDEO_LLM_PROVIDER: "${AI_VIDEO_LLM_PROVIDER:-mock}"
  AI_VIDEO_LLM_BASE_URL: "${AI_VIDEO_LLM_BASE_URL:-https://api.deepseek.com}"
  AI_VIDEO_LLM_MODEL: "${AI_VIDEO_LLM_MODEL:-deepseek-chat}"
  AI_VIDEO_LLM_API_KEY: "${AI_VIDEO_LLM_API_KEY:-}"
  AI_VIDEO_IMAGE_PROVIDER: "${AI_VIDEO_IMAGE_PROVIDER:-mock}"
  AI_VIDEO_IMAGE_BASE_URL: "${AI_VIDEO_IMAGE_BASE_URL:-}"
  AI_VIDEO_IMAGE_MODEL: "${AI_VIDEO_IMAGE_MODEL:-mock-reference-v1}"
  AI_VIDEO_IMAGE_API_KEY: "${AI_VIDEO_IMAGE_API_KEY:-}"
  AI_VIDEO_IMAGE_IDENTITY_WORKFLOW_PATH: "${AI_VIDEO_IMAGE_IDENTITY_WORKFLOW_PATH:-config/comfyui/flux-schnell-faceid-reference-api.json}"
  AI_VIDEO_VIDEO_PROVIDER: "${AI_VIDEO_VIDEO_PROVIDER:-mock}"
  AI_VIDEO_VIDEO_BASE_URL: "${AI_VIDEO_VIDEO_BASE_URL:-}"
  AI_VIDEO_VIDEO_MODEL: "${AI_VIDEO_VIDEO_MODEL:-mock-video-v1}"
  AI_VIDEO_VIDEO_API_KEY: "${AI_VIDEO_VIDEO_API_KEY:-}"
  AI_VIDEO_VIDEO_IMAGE_SIZE: "${AI_VIDEO_VIDEO_IMAGE_SIZE:-720x1280}"
  AI_VIDEO_TTS_PROVIDER: "${AI_VIDEO_TTS_PROVIDER:-mock}"
  AI_VIDEO_TTS_VOICE: "${AI_VIDEO_TTS_VOICE:-zh-CN-YunyangNeural}"
  AI_VIDEO_TTS_RATE: "${AI_VIDEO_TTS_RATE:--30%}"
  AI_VIDEO_TTS_PRONUNCIATION_DICTIONARY_PATH: "${AI_VIDEO_TTS_PRONUNCIATION_DICTIONARY_PATH:-config/pronunciation.toml}"
  AI_VIDEO_IDENTITY_AUDIT_ENABLED: "${AI_VIDEO_IDENTITY_AUDIT_ENABLED:-false}"
  AI_VIDEO_IDENTITY_AUDIT_PYTHON_PATH: "${AI_VIDEO_IDENTITY_AUDIT_PYTHON_PATH:-}"
  AI_VIDEO_IDENTITY_AUDIT_SCRIPT_PATH: "${AI_VIDEO_IDENTITY_AUDIT_SCRIPT_PATH:-scripts/face_identity_audit.py}"
  AI_VIDEO_IDENTITY_AUDIT_MODEL_ROOT: "${AI_VIDEO_IDENTITY_AUDIT_MODEL_ROOT:-}"
  AI_VIDEO_IDENTITY_AUDIT_THRESHOLD: "${AI_VIDEO_IDENTITY_AUDIT_THRESHOLD:-0.4}"
  AI_VIDEO_IDENTITY_AUDIT_FRAME_COUNT: "${AI_VIDEO_IDENTITY_AUDIT_FRAME_COUNT:-8}"
  AI_VIDEO_IDENTITY_AUDIT_TIMEOUT_SECONDS: "${AI_VIDEO_IDENTITY_AUDIT_TIMEOUT_SECONDS:-120}"
  AI_VIDEO_BGM_PROVIDER: "${AI_VIDEO_BGM_PROVIDER:-mock}"
  AI_VIDEO_BGM_SOURCE_ROOT: "${AI_VIDEO_BGM_SOURCE_ROOT:-/app/.tmp/bgm}"
  AI_VIDEO_BGM_SOURCE_PATH: "${AI_VIDEO_BGM_SOURCE_PATH:-}"
  AI_VIDEO_BGM_NORMALIZE_AUDIO: "${AI_VIDEO_BGM_NORMALIZE_AUDIO:-true}"
  AI_VIDEO_BGM_NORMALIZATION_TIMEOUT_SECONDS: "${AI_VIDEO_BGM_NORMALIZATION_TIMEOUT_SECONDS:-120}"
  AI_VIDEO_ASR_PROVIDER: "${AI_VIDEO_ASR_PROVIDER:-mock}"
  AI_VIDEO_ASR_BASE_URL: "${AI_VIDEO_ASR_BASE_URL:-}"
  AI_VIDEO_ASR_API_KEY: "${AI_VIDEO_ASR_API_KEY:-${AI_VIDEO_LLM_API_KEY:-}}"
  AI_VIDEO_ASR_ALIYUN_API_KEY: "${AI_VIDEO_ASR_ALIYUN_API_KEY:-}"
  AI_VIDEO_ASR_SILICONFLOW_API_KEY: "${AI_VIDEO_ASR_SILICONFLOW_API_KEY:-}"
  AI_VIDEO_ASR_OPENAI_COMPATIBLE_API_KEY: "${AI_VIDEO_ASR_OPENAI_COMPATIBLE_API_KEY:-}"
  AI_VIDEO_ASR_MODEL: "${AI_VIDEO_ASR_MODEL:-whisper-1}"
  AI_VIDEO_ASR_TIMEOUT_SECONDS: "${AI_VIDEO_ASR_TIMEOUT_SECONDS:-180}"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *app-environment
    ports:
      - "8000:8000"
    volumes:
      - ./.tmp/bgm:/app/.tmp/bgm:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uv", "run", "python", "-m", "app.workers.generation_worker"]
    environment: *app-environment
    volumes:
      - ./.tmp/bgm:/app/.tmp/bgm:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_video
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ai-video-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_video"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ai-video-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ai-video-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ai-video-dev-password}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ai-video-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000
        "${MINIO_ROOT_USER:-ai-video-dev}"
        "${MINIO_ROOT_PASSWORD:-ai-video-dev-password}"
        && mc mb --ignore-existing local/ai-video-artifacts

volumes:
  ai-video-postgres:
  ai-video-redis:
  ai-video-minio:
