  AI_VIDEO_ASR_TIMEOUT_SECONDS: "${AI_VIDEO_ASR_TIMEOUT_SECONDS:-180}"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *app-environment
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
      - ./.tmp/work:/app/.tmp/work
      - ./.tmp/renders:/app/.tmp/renders
      - ./.tmp/musetalk:/app/.tmp/musetalk
      - ./.tmp/bgm:/app/.tmp/bgm:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uv", "run", "python", "-m", "app.workers.generation_worker"]
    environment: *app-environment
    volumes:
      - ./config:/app/config:ro
      - ./.tmp/work:/app/.tmp/work
      - ./.tmp/renders:/app/.tmp/renders
      - ./.tmp/musetalk:/app/.tmp/musetalk
      - ./.tmp/bgm:/app/.tmp/bgm:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_video
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ai-video-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_video"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ai-video-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ai-video-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ai-video-dev-password}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ai-video-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000
        "${MINIO_ROOT_USER:-ai-video-dev}"
        "${MINIO_ROOT_PASSWORD:-ai-video-dev-password}"
        && mc mb --ignore-existing local/ai-video-artifacts

volumes:
  ai-video-postgres:
  ai-video-redis:
  ai-video-minio:
