# Windows GPU 主机运行档案
#
# 此文件只描述连接方式和保守的低显存基线，不绑定具体显卡型号，
# 不包含任何模型、用户名或密钥。请根据目标 GPU 的显存和实测结果调整参数。
# Windows 主机上的 Ollama / ComfyUI / MuseTalk bridge 通过
# host.docker.internal 被 Docker API/Worker 访问。

[app]
name = "ai-video-generation"
profile = "windows_gpu"
environment = "windows"
api_host = "0.0.0.0"
api_port = 8000
frontend_origin = "http://localhost:3000"
log_level = "INFO"

[visual_quality]
# Windows GPU 主机默认使用平衡档；是否能稳定运行仍需按宿主机显存和实测确认。
# 下面的基础值与 local_balanced 保持一致，直接调用 Provider 且没有任务快照时也不会出现两套规格。
default_profile = "local_balanced"

[auth]
mode = "local"
identity_ttl_seconds = 60
local_actor_id = "windows-operator"
local_actor_name = "Windows GPU 主机操作员"

[database]
url = "postgresql+asyncpg://postgres:postgres@postgres:5432/ai_video"

[persistence]
backend = "postgres"

[redis]
url = "redis://redis:6379/0"

[queue]
backend = "redis"
name = "ai-video-generation"
task_timeout_seconds = 3600
max_retries = 2

[storage]
provider = "minio"
base_path = "/app/.tmp/artifacts"
uri_prefix = "minio://"
endpoint = "http://minio:9000"
public_endpoint = "http://localhost:9000"
bucket = "ai-video-artifacts"
region = "us-east-1"
timeout_seconds = 180
signed_url_expire_seconds = 3600

[llm]
provider = "ollama"
base_url = "http://host.docker.internal:11434/v1"
# Ollama 的实际 tag；量化级别由已安装模型决定，不把 Q4 文件名伪装成 tag。
model = "qwen2.5:7b"
temperature = 0.5
request_timeout_seconds = 600

[image_generation]
provider = "comfyui"
base_url = "http://host.docker.internal:8188"
# 必须与 ComfyUI/models/unet/ 中的实际 GGUF 文件名一致；模型文件不提交到仓库。
model = "flux1-schnell-Q4_K_S.gguf"
request_timeout_seconds = 180
width = 576
height = 1024
default_style = "polished 2D manhwa animation production key art, clean single-frame vertical composition, crisp linework, clear facial planes, soft cel shading, controlled cinematic lighting, restrained color palette, clean silhouette, uncluttered readable background, professional webtoon production design, consistent design language for later image-to-video shots"
default_negative_prompt = "blurry, low quality, soft focus, low contrast, overexposed, underexposed, messy background, malformed face, asymmetrical eyes, distorted anatomy, deformed hands, extra fingers, cropped head, cut-off subject, duplicate person, duplicate object, split screen, split frame, diptych, triptych, collage, comic panels, character sheet, multiple views, inset image, repeated face, text, logo, watermark"
steps = 6
guidance = 4.0
identity_weight = 0.92
workflow_path = "config/comfyui/flux-schnell-t2i-api.json"
identity_workflow_path = "config/comfyui/flux-schnell-faceid-reference-api.json"
poll_interval_seconds = 2
max_poll_seconds = 1800

[video_generation]
provider = "comfyui_wan_i2v"
base_url = "http://host.docker.internal:8188"
# 必须与 ComfyUI/models/diffusion_models/ 中的实际 GGUF 文件名一致；
# 如宿主机使用其他量化文件，可通过 AI_VIDEO_VIDEO_MODEL 覆盖。
model = "wan2.1-i2v-14b-480p-Q4_K_S.gguf"
image_size = "384x672"
workflow_path = "config/comfyui/wan2.1-i2v-api.json"
request_timeout_seconds = 3600
poll_interval_seconds = 3
max_poll_seconds = 3600
max_download_bytes = 524288000
probe_timeout_seconds = 60
output_width = 384
output_height = 672
fps = 12
default_negative_prompt = "blurry, low quality, motion smear, flicker, jitter, unstable exposure, temporal inconsistency, identity drift, face morphing, changing hairstyle, changing clothes, distorted anatomy, deformed hands, extra limbs, duplicate person, new person, crowded frame, scene change, camera cut, hard zoom, text, logo, watermark"
prompt_suffix = "single continuous shot, 3 to 5 seconds, one coherent camera take, subtle readable motion such as breathing, blinking, a small head turn or gentle cloth movement, stable exposure, preserve the exact reference identity, face shape, hairstyle, clothing, colors and silhouette, keep the original composition, no new characters, no cuts, no scene change, no large body transformation"
steps = 8
cfg = 5.5
noise_aug_strength = 0.015
motion_zoom = 1.06
binary = "ffmpeg"
render_preset = "medium"
render_crf = 18
render_tune = "animation"
identity_audit_enabled = false
identity_audit_python_path = ""
identity_audit_script_path = "scripts/face_identity_audit.py"
identity_audit_model_root = ""
identity_audit_threshold = 0.4
identity_audit_frame_count = 8
identity_audit_timeout_seconds = 120

[tts]
# Docker Worker 无法直接调用 Windows Python 路径，因此默认使用免 Key 的
# Edge TTS。若以后把 ChatTTS 包装成 HTTP 服务，可通过环境变量切换 Provider。
provider = "edge_tts"
voice = "zh-CN-YunyangNeural"
rate = "-30%"
volume = "+0%"
request_timeout_seconds = 120
probe_timeout_seconds = 60
max_text_characters = 5000
pacing_enabled = false
pause_compaction_enabled = false
pronunciation_dictionary_path = "config/pronunciation.toml"

[lip_sync]
provider = "musetalk_http"
base_url = "http://host.docker.internal:8090"
create_path = "/v1/lip-sync"
health_path = "/healthz"
runtime_path = ""
script_path = ""
model_root = ""
device = "cuda"
model = "MuseTalk-local"
timeout_seconds = 1800
max_download_bytes = 524288000

[bgm]
provider = "local_file"
source_root = "/app/.tmp/bgm"
source_path = ""
normalize_audio = true
normalization_timeout_seconds = 180

[subtitle_alignment]
provider = "mock_sentence"

[asr]
provider = "mock"
base_url = ""
model = "whisper-1"
request_timeout_seconds = 180
binary = "whisper-cli"
model_path = ""
threads = 4

[worker]
auto_retry_enabled = true
max_auto_retries = 2
retry_backoff_seconds = 10
retry_max_backoff_seconds = 180
stale_task_timeout_seconds = 7200
gpu_lock_enabled = true
gpu_lock_key = "ai-video:gpus:windows-gpu"
gpu_lock_ttl_seconds = 7200
gpu_lock_wait_seconds = 10
cleanup_enabled = true
cleanup_interval_seconds = 900
cleanup_max_age_hours = 24
cleanup_roots = [".tmp/work", ".tmp/renders", ".tmp/musetalk"]
cleanup_max_files_per_run = 500
cleanup_min_free_gb = 10
scheduler_enabled = true
scheduler_interval_seconds = 15
